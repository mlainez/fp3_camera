%YAML 1.1
---
# libcamera configuration for streams from the full-resolution sensor mode:
# eight debayer threads keep up with 4K at 30 fps, frames are laid out for
# Venus to encode in place, and camss hands over capture buffers already
# synced for the CPU.
version: 1
configuration:
  software_isp:
    threads: 8
    sync_input_buffer: false
    nv12_plane_alignment: 32
